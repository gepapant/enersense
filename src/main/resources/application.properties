spring.application.name=enersense-api

spring.datasource.url=jdbc:postgresql://localhost:5432/enersense
spring.datasource.username=postgres
spring.datasource.password=${ENERSENSE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.mongodb.uri=mongodb://localhost:27017/enersense_telemetry

enersense.mqtt.broker=tcp://localhost:1883
enersense.mqtt.client-id=enersense-backend
enersense.mqtt.topic=enersense/devices/+/telemetry

enersense.security.jwt-secret=${ENERSENSE_JWT_SECRET}
enersense.security.jwt-expiration-minutes=120