# ===============================
# EnerSense - Production Profile
# ===============================

# Elastic Beanstalk forwards traffic to the application port.
server.port=${PORT:5000}

# ===============================
# PostgreSQL
# ===============================

spring.datasource.url=${ENERSENSE_DB_URL}
spring.datasource.username=${ENERSENSE_DB_USERNAME}
spring.datasource.password=${ENERSENSE_DB_PASSWORD}

# ===============================
# MongoDB
# ===============================

spring.mongodb.uri=${ENERSENSE_MONGODB_URI}

# ===============================
# MQTT
# ===============================

enersense.mqtt.broker=${ENERSENSE_MQTT_BROKER}
enersense.mqtt.client-id=${ENERSENSE_MQTT_CLIENT_ID:enersense-backend}
enersense.mqtt.topic=${ENERSENSE_MQTT_TOPIC:enersense/devices/+/telemetry}

# ===============================
# Security
# ===============================

enersense.security.jwt-secret=${ENERSENSE_JWT_SECRET}
enersense.security.jwt-expiration-minutes=${ENERSENSE_JWT_EXPIRATION_MINUTES:120}